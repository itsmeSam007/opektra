name: portfolio

# FounderOS local ports — see PORTS.md (defaults avoid 3000/8000/5432/6379 conflicts)
x-founderos-ports: &founderos-ports
  FOS_PORT_FRONTEND: ${FOS_PORT_FRONTEND:-13000}
  FOS_PORT_API: ${FOS_PORT_API:-18000}
  FOS_PORT_POSTGRES: ${FOS_PORT_POSTGRES:-15432}
  FOS_PORT_REDIS: ${FOS_PORT_REDIS:-16379}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "${FOS_PORT_POSTGRES:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${FOS_PORT_REDIS:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${FOS_PORT_API:-18000}:8000"
    environment:
      <<: *founderos-ports
      APP_ENV: development
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:${FOS_PORT_FRONTEND:-13000},http://frontend:3000
      SECRET_KEY: dev-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      MEDIA_ROOT: /data/media
      TENANT_ID: default
      ADMIN_EMAIL: admin@founderos.local
      ADMIN_PASSWORD: admin123
      SITE_URL: http://localhost:${FOS_PORT_FRONTEND:-13000}
      GITHUB_USERNAME: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - founderos_media:/data/media

  frontend:
    build: ./frontend
    ports:
      - "${FOS_PORT_FRONTEND:-13000}:3000"
    environment:
      <<: *founderos-ports
      DOCKER_BUILD: "0"
      NEXT_PUBLIC_SITE_URL: http://localhost:${FOS_PORT_FRONTEND:-13000}
      API_PROXY_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  founderos_media:

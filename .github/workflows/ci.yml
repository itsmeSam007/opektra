name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
      ADMIN_EMAIL: admin@founderos.local
      ADMIN_PASSWORD: admin123
      MEDIA_ROOT: /tmp/founderos-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (compile check)
        run: python -m compileall app
      - name: Initialize test database and administrator
        run: python -c "from app.main import on_startup; on_startup()"
      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
        if: always()

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development dependencies
        run: npm audit --audit-level=high
      - name: Unit tests
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:13000
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:18000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:13000

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:18000/api/v1/health && break
            sleep 3
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:13000 > /dev/null && break
            sleep 3
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run E2E smoke + a11y
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:13000
          E2E_ADMIN_EMAIL: admin@founderos.local
          E2E_ADMIN_PASSWORD: admin123
        run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

  security-scan:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Start API stack
        run: |
          docker compose up -d db redis backend --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:18000/api/v1/health && break
            sleep 3
          done
      - name: OWASP ZAP baseline (API health)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:18000/api/v1/health
          cmd_options: "-a -j"
        continue-on-error: true
